
<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Metal UI</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;

      background:
        radial-gradient(
          circle at center,
          #30343a 0%,
          #17191c 55%,
          #0b0c0e 100%
        );

      color: white;
      font-family: Arial, sans-serif;
      overflow-x: hidden;
    }

    /* ANA EKRAN */
    .screen {
      position: relative;

      min-height: 180vh;
      width: 100%;

      padding: 80px 70px;

      background:
        linear-gradient(
          135deg,
          rgba(255,255,255,0.05) 0%,
          transparent 20%,
          rgba(255,255,255,0.025) 50%,
          transparent 80%
        ),
        linear-gradient(#292d31, #111315);
    }

    /* KIRMIZI KENAR IŞIKLARI */
    .red-line-left,
    .red-line-right {
      position: fixed;

      top: 0;
      bottom: 0;

      width: 4px;

      z-index: 10;

      background: #ff2020;

      box-shadow:
        0 0 5px #ff0000,
        0 0 15px #ff0000,
        0 0 30px rgba(255, 0, 0, 0.8),
        0 0 60px rgba(255, 0, 0, 0.35);
    }

    .red-line-left {
      left: 22px;
    }

    .red-line-right {
      right: 22px;
    }

    /* ANA METAL PANEL */
    .panel {
      max-width: 1100px;

      min-height: 500px;

      margin: 0 auto 100px;

      padding: 40px;

      background:
        linear-gradient(
          145deg,
          #4a4e52,
          #25282b 35%,
          #151719 70%,
          #363a3e
        );

      border: 1px solid #555a5f;

      border-radius: 8px;

      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.12),
        inset 0 -1px 0 rgba(0,0,0,0.8),
        0 20px 50px rgba(0,0,0,0.5);
    }

    /* BAŞLIK */
    h1 {
      font-size: 42px;

      letter-spacing: 4px;

      color: #eee;

      text-shadow:
        0 2px 4px #000;
    }

    /* MAVİ YAZILAR */
    .blue-link {
      color: #2997ff;

      text-decoration: none;

      cursor: pointer;

      transition:
        color 0.2s ease,
        text-shadow 0.2s ease;
    }

    .blue-link:hover {
      color: #66b5ff;

      text-shadow:
        0 0 8px rgba(41,151,255,0.7);
    }

    /* AÇIKLAMA */
    p {
      margin-top: 20px;

      color: #aaa;

      line-height: 1.7;

      font-size: 16px;
    }

    /* METAL ÇİZGİ */
    .metal-line {
      height: 2px;

      margin-top: 30px;

      background:
        linear-gradient(
          90deg,
          transparent,
          #777,
          #ddd,
          #777,
          transparent
        );

      opacity: 0.35;
    }

    /* 4 BÖLÜM */
    .four-sections {
      max-width: 1100px;

      margin: 0 auto 100px;

      display: grid;

      grid-template-columns: repeat(4, 1fr);

      gap: 20px;

      align-items: stretch;
    }

    /* KART */
    .small-section {
      min-height: 350px;

      padding: 20px;

      position: relative;

      display: flex;

      flex-direction: column;

      align-items: center;

      background:
        linear-gradient(
          145deg,
          #4a4e52,
          #292d30 35%,
          #151719 70%,
          #383c40
        );

      border: 1px solid #555a5f;

      border-radius: 8px;

      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.12),
        inset 0 -1px 0 rgba(0,0,0,0.8),
        0 15px 35px rgba(0,0,0,0.45);

      transition:
        transform 0.2s ease,
        border-color 0.2s ease;
    }

    .small-section:hover {
      border-color: #777;

      transform: translateY(-3px);
    }

    /* KART BAŞLIKLARI */
    .egg-title {
      width: 100%;

      margin-bottom: 15px;

      color: #eee;

      font-size: 22px;

      font-weight: bold;

      letter-spacing: 2px;

      text-align: left;

      text-shadow:
        0 2px 4px #000;
    }

    /* RESİMLER */
    .item-image {
      width: 100%;

      height: 210px;

      object-fit: contain;

      display: block;

      margin-bottom: 18px;

      border-radius: 5px;
    }

    /* GET BUTONU */
    .get-button {
      width: 100%;

      height: 48px;

      margin-top: auto;

      border: 1px solid #1685e5;

      border-radius: 5px;

      background:
        linear-gradient(
          180deg,
          #2997ff,
          #0878d1
        );

      color: white;

      font-size: 18px;

      font-weight: bold;

      letter-spacing: 2px;

      text-shadow:
        0 1px 2px #000;

      cursor: pointer;

      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.3),
        0 4px 10px rgba(0,0,0,0.35);

      transition:
        background 0.15s ease,
        transform 0.15s ease;
    }

    .get-button:hover {
      background:
        linear-gradient(
          180deg,
          #4ba8ff,
          #1689df
        );

      transform: translateY(-1px);
    }

    .get-button:active {
      transform: translateY(1px);
    }

    /* SCROLLBAR */
    ::-webkit-scrollbar {
      width: 10px;
    }

    ::-webkit-scrollbar-track {
      background: #0b0c0e;
    }

    ::-webkit-scrollbar-thumb {
      background:
        linear-gradient(
          #555,
          #222
        );

      border-radius: 5px;

      border: 1px solid #666;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #777;
    }

    /* TABLET */
    @media (max-width: 900px) {

      .four-sections {
        grid-template-columns: repeat(2, 1fr);
      }

    }

    /* TELEFON */
    @media (max-width: 700px) {

      .screen {
        padding: 50px 40px;
      }

      .red-line-left {
        left: 10px;
      }

      .red-line-right {
        right: 10px;
      }

      .panel {
        padding: 25px;
      }

      h1 {
        font-size: 28px;
      }

      p {
        font-size: 14px;
      }

      .four-sections {
        grid-template-columns: 1fr;
      }

      .small-section {
        min-height: 350px;
      }

    }
  </style>
</head>

<body>

  <!-- KIRMIZI KENAR IŞIKLARI -->
  <div class="red-line-left"></div>
  <div class="red-line-right"></div>


  <!-- ANA EKRAN -->
  <main class="screen">


    <!-- START HERE -->
    <section class="panel">

      <h1>
        <a
          href="#"
          class="blue-link"
          onclick="return false;"
        >
          Start Here
        </a>
      </h1>

      <div class="metal-line"></div>

      <p>
        Start Your Business Now In

        Here

        More Info

        <a
          href="#"
          class="blue-link"
          onclick="return false;"
        >
          Here
        </a>
      </p>

    </section>


    <!-- 4 EGG BÖLÜMÜ -->
    <section class="four-sections">


      <!-- 1. EGG -->
      <div class="small-section">

        <div class="egg-title">
          EGG
        </div>

        <img
          src="png1.png"
          alt="EGG"
          class="item-image"
        >

        <button
          class="get-button"
          type="button"
          onclick="return false;"
        >
          GET
        </button>

      </div>


      <!-- 2. MEATMAN EGG -->
      <div class="small-section">

        <div class="egg-title">
          MEATMAN EGG
        </div>

        <img
          src="png2.png"
          alt="MEATMAN EGG"
          class="item-image"
        >

        <button
          class="get-button"
          type="button"
          onclick="return false;"
        >
          GET
        </button>

      </div>


      <!-- 3. GOOGOO EGG -->
      <div class="small-section">

        <div class="egg-title">
          GOOGOO EGG
        </div>

        <img
          src="png3.png"
          alt="GOOGOO EGG"
          class="item-image"
        >

        <button
          class="get-button"
          type="button"
          onclick="return false;"
        >
          GET
        </button>

      </div>


      <!-- 4. SECRET EGG -->
      <div class="small-section">

        <div class="egg-title">
          SECRET EGG
        </div>

        <img
          src="png4.png"
          alt="SECRET EGG"
          class="item-image"
        >

        <button
          class="get-button"
          type="button"
          onclick="return false;"
        >
          GET
        </button>

      </div>


    </section>

  </main>

</body>
</html>
