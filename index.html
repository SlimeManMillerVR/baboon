
<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Metal UI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: white;
      background:
        radial-gradient(circle at 50% 0%, #555 0%, #252525 35%, #090909 75%, #000 100%);
      overflow-x: hidden;
    }

    /* METAL KENARLAR */
    body::before,
    body::after {
      content: "";
      position: fixed;
      top: 0;
      width: 4px;
      height: 100vh;
      z-index: 100;
      pointer-events: none;
      background: linear-gradient(
        to bottom,
        #ff0000,
        #ff4444,
        #990000,
        #ff0000
      );
      box-shadow:
        0 0 8px red,
        0 0 18px rgba(255, 0, 0, 0.7);
    }

    body::before {
      left: 0;
    }

    body::after {
      right: 0;
    }

    .screen {
      min-height: 180vh;
      padding: 80px 70px;
    }

    .panel {
      width: 100%;
      max-width: 1100px;
      min-height: 500px;
      margin: 0 auto;
      padding: 45px;

      background:
        linear-gradient(
          135deg,
          #777 0%,
          #444 18%,
          #a0a0a0 35%,
          #505050 50%,
          #929292 68%,
          #383838 85%,
          #707070 100%
        );

      border: 2px solid #aaa;
      border-radius: 10px;

      box-shadow:
        inset 0 0 20px rgba(255,255,255,0.15),
        inset 0 0 45px rgba(0,0,0,0.35),
        0 0 25px rgba(0,0,0,0.8);
    }

    h1 {
      margin: 0;
      font-size: 42px;
      font-weight: bold;
      color: white;

      text-shadow:
        0 2px 2px #000,
        0 0 7px rgba(255,255,255,0.25);
    }

    .metal-line {
      width: 100%;
      height: 5px;
      margin: 20px 0 30px;

      background:
        linear-gradient(
          to right,
          #222,
          #aaa,
          #eee,
          #666,
          #222
        );

      box-shadow:
        0 1px 3px #000;
    }

    p {
      font-size: 20px;
      line-height: 1.7;
      color: #f5f5f5;
      text-shadow: 0 1px 2px #000;
    }

    .blue-link {
      color: #008cff;
      text-decoration: none;
      font-weight: bold;
      cursor: pointer;

      text-shadow:
        0 0 7px rgba(0,140,255,0.7);
    }

    /* 4 KUTU */
    .four-sections {
      margin-top: 50px;

      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
    }

    .small-section {
      min-height: 310px;
      padding: 20px;

      display: flex;
      flex-direction: column;
      align-items: center;

      position: relative;

      background:
        linear-gradient(
          145deg,
          #777 0%,
          #3b3b3b 25%,
          #929292 50%,
          #444 75%,
          #707070 100%
        );

      border: 2px solid #888;
      border-radius: 8px;

      box-shadow:
        inset 0 0 18px rgba(255,255,255,0.12),
        inset 0 0 25px rgba(0,0,0,0.35),
        0 0 15px rgba(0,0,0,0.7);
    }

    .egg-title {
      font-size: 21px;
      font-weight: bold;
      margin-bottom: 15px;

      color: white;

      text-shadow:
        0 2px 3px black;
    }

    .item-image {
      width: 150px;
      height: 150px;

      object-fit: contain;

      margin-bottom: 15px;
    }

    /* MAVİ GET */
    .get-button {
      width: 100%;
      height: 48px;

      margin-top: auto;

      border: 1px solid #159cff;
      border-radius: 5px;

      background:
        linear-gradient(
          to bottom,
          #159cff,
          #0074d9
        );

      color: white;

      font-size: 17px;
      font-weight: bold;

      cursor: pointer;

      box-shadow:
        0 0 8px rgba(0,140,255,0.35),
        inset 0 1px 2px rgba(255,255,255,0.35);
    }

    .get-button:hover {
      filter: brightness(1.12);
    }

    /* GOOGOO BUTONLARI */
    .googoo-buttons {
      width: 100%;

      display: flex;
      gap: 10px;

      margin-top: auto;
    }

    .googoo-button {
      flex: 1;
      height: 48px;

      border-radius: 5px;

      color: white;
      font-size: 17px;
      font-weight: bold;

      cursor: pointer;

      position: relative;
      overflow: visible;
    }

    /* SARI */
    .yellow-button {
      border: 1px solid #ffe000;

      background:
        linear-gradient(
          to bottom,
          #ffe900,
          #d5aa00
        );

      box-shadow:
        0 0 8px rgba(255,220,0,0.3),
        inset 0 1px 2px rgba(255,255,255,0.35);
    }

    /* YEŞİL */
    .green-button {
      border: 1px solid #28d84b;

      background:
        linear-gradient(
          to bottom,
          #2bd94e,
          #15952d
        );

      box-shadow:
        0 0 8px rgba(0,255,60,0.25),
        inset 0 1px 2px rgba(255,255,255,0.35);
    }

    /* 30 GOLD ÜSTÜNDEKİ KIRMIZI ÇİZGİ */
    .crossed-gold {
      position: relative;
      display: inline-block;
    }

    .crossed-gold::after {
      content: "";

      position: absolute;

      left: -4px;
      right: -4px;

      top: 50%;

      height: 3px;

      background: red;

      transform:
        translateY(-50%)
        rotate(-3deg);

      pointer-events: none;
    }

    /* YEŞİL BUTONUN SAĞ ÜSTÜNDEKİ 10 */
    .gold-number {
      position: absolute;

      top: -9px;
      right: -7px;

      font-size: 13px;
      font-weight: bold;

      color: white;

      text-shadow:
        0 0 3px white,
        0 0 7px #00c8ff,
        0 0 12px #00c8ff;

      animation: softGlow 1.5s infinite alternate;

      z-index: 20;
    }

    @keyframes softGlow {
      from {
        opacity: 0.75;

        text-shadow:
          0 0 3px white,
          0 0 6px #00c8ff;
      }

      to {
        opacity: 1;

        text-shadow:
          0 0 5px white,
          0 0 10px #00c8ff,
          0 0 15px #00c8ff;
      }
    }

    @media (max-width: 900px) {
      .four-sections {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 600px) {
      .screen {
        padding: 40px 20px;
      }

      .panel {
        padding: 25px;
      }

      .four-sections {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <div class="screen">

    <div class="panel">

      <h1>Start Here</h1>

      <div class="metal-line"></div>

      <p>
        Start Your Business Now In

        Here

        More Info

        <a
          href="#"
          class="blue-link"
          onclick="return false;"
        >
          Here
        </a>
      </p>


      <div class="four-sections">

        <!-- 1. EGG -->
        <div class="small-section">

          <div class="egg-title">
            EGG
          </div>

          <img
            src="png1.png"
            alt="EGG"
            class="item-image"
          >

          <button
            class="get-button"
            type="button"
            onclick="return false;"
          >
            GET
          </button>

        </div>


        <!-- 2. MEATMAN EGG -->
        <div class="small-section">

          <div class="egg-title">
            MEATMAN EGG
          </div>

          <img
            src="png2.png"
            alt="MEATMAN EGG"
            class="item-image"
          >

          <button
            class="get-button"
            type="button"
            onclick="return false;"
          >
            GET
          </button>

        </div>


        <!-- 3. GOOGOO EGG -->
        <div class="small-section">

          <div class="egg-title">
            GOOGOO EGG
          </div>

          <img
            src="png3.png"
            alt="GOOGOO EGG"
            class="item-image"
          >

          <!-- NORMAL GET -->
          <button
            id="googooGet"
            class="get-button"
            type="button"
            onclick="showGoogooOptions(event)"
          >
            GET
          </button>


          <!-- 2 SATIN ALMA BUTONU -->
          <div
            id="googooButtons"
            class="googoo-buttons"
            style="display:none;"
          >

            <!-- 0.99$ -->
            <button
              class="googoo-button yellow-button"
              type="button"
              onclick="return false;"
            >
              0.99$
            </button>


            <!-- 30 GOLD -->
            <button
              class="googoo-button green-button"
              type="button"
              onclick="return false;"
            >

              <span class="crossed-gold">
                30 GOLD
              </span>

              <!-- SAĞ ÜSTTE 10 -->
              <span class="gold-number">
                10
              </span>

            </button>

          </div>

        </div>


        <!-- 4. SECRET EGG -->
        <div class="small-section">

          <div class="egg-title">
            SECRET EGG
          </div>

          <img
            src="png4.png"
            alt="SECRET EGG"
            class="item-image"
          >

          <button
            class="get-button"
            type="button"
            onclick="return false;"
          >
            GET
          </button>

        </div>

      </div>

    </div>

  </div>


  <script>

    function showGoogooOptions(event) {

      event.stopPropagation();

      const getButton =
        document.getElementById("googooGet");

      const buttons =
        document.getElementById("googooButtons");


      /* GET GİTSİN */
      getButton.style.display = "none";


      /* 0.99$ + 30 GOLD GELSİN */
      buttons.style.display = "flex";


      /* 15 SANİYE SONRA ESKİ HALİNE DÖN */
      setTimeout(function() {

        buttons.style.display = "none";

        getButton.style.display = "block";

      }, 15000);

    }

  </script>

</body>
</html>
