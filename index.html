
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Metal UI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at 50% 20%, #3a3a3a 0%, #151515 45%, #050505 100%);
      color: white;
      overflow-x: hidden;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      top: 0;
      width: 3px;
      height: 100vh;
      background: #ff0000;
      box-shadow:
        0 0 8px #ff0000,
        0 0 18px rgba(255, 0, 0, 0.8);
      z-index: 10;
    }

    body::before {
      left: 0;
    }

    body::after {
      right: 0;
    }

    .screen {
      min-height: 180vh;
      padding: 80px 70px;
    }

    .panel {
      width: 100%;
      max-width: 1100px;
      min-height: 500px;
      margin: 0 auto;
      padding: 45px;

      background:
        linear-gradient(
          135deg,
          #777 0%,
          #3c3c3c 20%,
          #a2a2a2 40%,
          #444 60%,
          #8a8a8a 80%,
          #2d2d2d 100%
        );

      border: 2px solid #aaa;
      border-radius: 10px;

      box-shadow:
        inset 0 0 30px rgba(255,255,255,0.12),
        0 0 30px rgba(0,0,0,0.8);
    }

    h1 {
      margin: 0;
      font-size: 42px;
      color: white;
      text-shadow:
        0 2px 3px black,
        0 0 8px rgba(255,255,255,0.25);
    }

    .metal-line {
      width: 100%;
      height: 5px;
      margin: 20px 0 30px;

      background:
        linear-gradient(
          to right,
          #222,
          #aaa,
          #222
        );

      box-shadow:
        0 0 8px rgba(255,255,255,0.25);
    }

    p {
      font-size: 20px;
      line-height: 1.7;
      color: #f5f5f5;
      text-shadow: 0 1px 2px black;
    }

    .blue-link {
      color: #008cff;
      text-decoration: none;
      font-weight: bold;
      cursor: pointer;
      text-shadow: 0 0 8px rgba(0,140,255,0.7);
    }

    .four-sections {
      margin-top: 50px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
    }

    .small-section {
      min-height: 310px;
      padding: 20px;

      display: flex;
      flex-direction: column;
      align-items: center;

      background:
        linear-gradient(
          145deg,
          #686868,
          #292929,
          #5d5d5d
        );

      border: 2px solid #888;
      border-radius: 8px;

      box-shadow:
        inset 0 0 20px rgba(255,255,255,0.08),
        0 0 15px rgba(0,0,0,0.7);

      position: relative;
    }

    .egg-title {
      font-size: 21px;
      font-weight: bold;
      margin-bottom: 15px;
      text-shadow: 0 2px 3px black;
    }

    .item-image {
      width: 150px;
      height: 150px;
      object-fit: contain;
      margin-bottom: 15px;
    }

    .get-button {
      width: 100%;
      height: 48px;
      margin-top: auto;

      border: 1px solid #1499ff;
      border-radius: 5px;

      background:
        linear-gradient(
          to bottom,
          #159cff,
          #006dcc
        );

      color: white;
      font-size: 17px;
      font-weight: bold;

      cursor: pointer;

      box-shadow:
        0 0 10px rgba(0,140,255,0.4),
        inset 0 1px 2px rgba(255,255,255,0.4);
    }

    .get-button:hover {
      filter: brightness(1.15);
    }

    .googoo-buttons {
      width: 100%;
      display: flex;
      gap: 10px;
      margin-top: auto;
    }

    .googoo-button {
      flex: 1;
      height: 48px;

      border-radius: 5px;
      color: white;

      font-size: 17px;
      font-weight: bold;

      cursor: pointer;

      position: relative;
      overflow: visible;
    }

    .yellow-button {
      border: 1px solid #ffe600;

      background:
        linear-gradient(
          to bottom,
          #ffe900,
          #d7ad00
        );

      box-shadow:
        0 0 10px rgba(255,220,0,0.35),
        inset 0 1px 2px rgba(255,255,255,0.4);
    }

    .green-button {
      border: 1px solid #24d84b;

      background:
        linear-gradient(
          to bottom,
          #28d94e,
          #15952d
        );

      box-shadow:
        0 0 10px rgba(0,255,60,0.3),
        inset 0 1px 2px rgba(255,255,255,0.4);
    }

    .crossed-gold {
      position: relative;
      display: inline-block;
    }

    .crossed-gold::after {
      content: "";

      position: absolute;
      left: -4px;
      right: -4px;
      top: 50%;

      height: 3px;
      background: red;

      transform: translateY(-50%) rotate(-3deg);

      pointer-events: none;
    }

    /* 10 - YEŞİL BUTONUN SAĞ ÜSTÜNDE */
    .gold-number {
      position: absolute;

      top: -10px;
      right: -7px;

      font-size: 13px;
      font-weight: bold;

      color: white;

      text-shadow:
        0 0 4px white,
        0 0 8px #00ffff,
        0 0 14px #00ffff;

      animation: numberGlow 1.4s infinite alternate;

      z-index: 5;
    }

    @keyframes numberGlow {
      from {
        opacity: 0.7;
        transform: scale(1);
        text-shadow:
          0 0 3px white,
          0 0 7px #00ffff;
      }

      to {
        opacity: 1;
        transform: scale(1.08);
        text-shadow:
          0 0 5px white,
          0 0 10px #00ffff,
          0 0 16px #00ffff;
      }
    }

    @media (max-width: 900px) {
      .four-sections {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 600px) {
      .screen {
        padding: 40px 20px;
      }

      .panel {
        padding: 25px;
      }

      .four-sections {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <div class="screen">

    <div class="panel">

      <h1>Start Here</h1>

      <div class="metal-line"></div>

      <p>
        Start Your Business Now In

        Here

        More Info

        <a href="#" class="blue-link" onclick="return false;">
          Here
        </a>
      </p>

      <div class="four-sections">

        <!-- EGG -->
        <div class="small-section">

          <div class="egg-title">
            EGG
          </div>

          <img
            src="png1.png"
            alt="EGG"
            class="item-image"
          >

          <button
            class="get-button"
            type="button"
            onclick="return false;"
          >
            GET
          </button>

        </div>


        <!-- MEATMAN EGG -->
        <div class="small-section">

          <div class="egg-title">
            MEATMAN EGG
          </div>

          <img
            src="png2.png"
            alt="MEATMAN EGG"
            class="item-image"
          >

          <button
            class="get-button"
            type="button"
            onclick="return false;"
          >
            GET
          </button>

        </div>


        <!-- GOOGOO EGG -->
        <div class="small-section">

          <div class="egg-title">
            GOOGOO EGG
          </div>

          <img
            src="png3.png"
            alt="GOOGOO EGG"
            class="item-image"
          >

          <!-- NORMAL GET -->
          <button
            id="googooGet"
            class="get-button"
            type="button"
            onclick="showGoogooOptions(event)"
          >
            GET
          </button>

          <!-- PURCHASE BUTTONS -->
          <div
            id="googooButtons"
            class="googoo-buttons"
            style="display:none;"
          >

            <!-- 0.99$ -->
            <button
              class="googoo-button yellow-button"
              type="button"
              onclick="return false;"
            >
              0.99$
            </button>

            <!-- 30 GOLD -->
            <button
              class="googoo-button green-button"
              type="button"
              onclick="return false;"
            >

              <span class="crossed-gold">
                30 GOLD
              </span>

              <!-- 10 -->
              <span class="gold-number">
                10
              </span>

            </button>

          </div>

        </div>


        <!-- SECRET EGG -->
        <div class="small-section">

          <div class="egg-title">
            SECRET EGG
          </div>

          <img
            src="png4.png"
            alt="SECRET EGG"
            class="item-image"
          >

          <button
            class="get-button"
            type="button"
            onclick="return false;"
          >
            GET
          </button>

        </div>

      </div>

    </div>

  </div>


  <script>

    function showGoogooOptions(event) {

      event.stopPropagation();

      const getButton =
        document.getElementById("googooGet");

      const buttons =
        document.getElementById("googooButtons");

      getButton.style.display = "none";

      buttons.style.display = "flex";


      setTimeout(function() {

        buttons.style.display = "none";

        getButton.style.display = "block";

      }, 15000);

    }

  </script>

</body>
</html>
